name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (example: v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION_NAME="${TAG#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" || -z "${STORE_PASSWORD}" ]]; then
            echo "Missing one or more required Android signing secrets."
            echo "Required: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD, ANDROID_UPLOAD_STORE_PASSWORD"
            exit 1
          fi

          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name "${{ steps.release_meta.outputs.version_name }}"
          --build-number "${{ steps.release_meta.outputs.build_number }}"

      - name: Prepare release assets
        id: prepare_assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.release_meta.outputs.version_name }}"
          BUILD_NUMBER="${{ steps.release_meta.outputs.build_number }}"

          VERSIONED_APK="scoard-game-v${VERSION_NAME}+${BUILD_NUMBER}.apk"
          LATEST_APK="scoard-game-latest.apk"
          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"

          cp "$SOURCE_APK" "$VERSIONED_APK"
          cp "$SOURCE_APK" "$LATEST_APK"

          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"
          echo "latest_apk=$LATEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            ${{ steps.prepare_assets.outputs.latest_apk }}
            ${{ steps.prepare_assets.outputs.versioned_apk }}
