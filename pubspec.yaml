name: scoard_game
description: "Scoard Game restart shell for board game scoring."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  drift: ^2.28.2
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.39
  wakelock_plus: ^1.7.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Scoring templates. See _specs/template_schema_v1.md.
  assets:
    - assets/templates/
